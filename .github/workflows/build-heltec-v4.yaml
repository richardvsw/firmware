name: Build Heltec V4

on:
  push:
    branches:
      - develop
    paths:
      - 'variants/esp32s3/heltec_v4/**'
      - '.github/workflows/build-heltec-v4.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Build heltec-v4
        run: pio run -e heltec-v4

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: heltec-v4-firmware
          path: |
            .pio/build/heltec-v4/firmware-heltec-v4-*.bin
            .pio/build/heltec-v4/firmware-heltec-v4-*.elf
            .pio/build/heltec-v4/littlefs-heltec-v4-*.bin
          retention-days: 30
