name: Build RiV Variants (Firmware 2.8.2)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'variants/esp32s3/diy/RiV_*/**'
      - '.github/workflows/build-riv-variants.yaml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target RiV variant to build'
        required: true
        default: 'RiV_xiao-s3-tft-portrait-en-emoji'
        type: choice
        options:
          - 'RiV_xiao-s3-tft-portrait-en-emoji'
          - 'RiV_xiao-s3-tft-portrait-en'
          - 'RiV_xiao-s3-tft-en-emoji'
          - 'RiV_xiao-s3-tft-portrait'
          - 'RiV_xiao-s3-tft'
          - 'RiV_mesh-tab-st7796'
          - 'RiV_handheld-s3'
          - 'RiV_handheld-s3-st7789'
          - 'RiV_meshnode-s3'
          - 'all-core'

concurrency:
  group: build-riv-${{ github.ref }}-${{ inputs.target || 'push' }}
  cancel-in-progress: true

jobs:
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - id: set-targets
        run: |
          TARGET="${{ inputs.target || 'RiV_xiao-s3-tft-portrait-en-emoji' }}"
          if [ "$TARGET" = "all-core" ]; then
            echo 'targets=["RiV_xiao-s3-tft-portrait-en-emoji", "RiV_mesh-tab-st7796", "RiV_handheld-s3", "RiV_meshnode-s3"]' >> $GITHUB_OUTPUT
          else
            echo "targets=[\"$TARGET\"]" >> $GITHUB_OUTPUT
          fi

  build:
    needs: matrix-prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix-prep.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.target }}-
            pio-${{ runner.os }}-

      - name: Build variant ${{ matrix.target }}
        run: |
          pio run -e ${{ matrix.target }}

      - name: Summary
        run: |
          echo "### 🚀 Build Succeeded for \`${{ matrix.target }}\`" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for f in .pio/build/${{ matrix.target }}/*.bin; do
            if [ -f "$f" ]; then
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              NAME=$(basename "$f")
              echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            .pio/build/${{ matrix.target }}/firmware-${{ matrix.target }}-*.bin
            .pio/build/${{ matrix.target }}/firmware-${{ matrix.target }}-*.factory.bin
            .pio/build/${{ matrix.target }}/firmware-${{ matrix.target }}-*.elf
            .pio/build/${{ matrix.target }}/littlefs-${{ matrix.target }}-*.bin
          if-no-files-found: warn
          retention-days: 30
