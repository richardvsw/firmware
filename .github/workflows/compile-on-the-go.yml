name: Compile Custom Variant On The Go

on:
  workflow_dispatch:
    inputs:
      variant_name:
        description: 'Custom variant name (e.g. custom_my_node)'
        required: true
        default: 'custom_online_variant'
      board:
        description: 'PlatformIO Board ID'
        required: true
        default: 'seeed-xiao-s3'
      variant_header_b64:
        description: 'Base64 encoded variant.h'
        required: true
      platformio_env_b64:
        description: 'Base64 encoded platformio_env.ini'
        required: true

  repository_dispatch:
    types: [compile_variant]

  issues:
    types: [opened, labeled]

concurrency:
  group: compile-on-the-go-${{ github.ref }}-${{ github.event_name }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  build-custom:
    # Only run for workflow_dispatch, repository_dispatch, or issues with [Compile] in title or 'compile' label
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && (contains(github.event.issue.title, '[Compile]') || contains(github.event.issue.labels.*.name, 'compile')))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Extract & Prepare Custom Variant Files
        id: prep
        run: |
          VAR_NAME="custom_online_variant"
          BOARD_ID="seeed-xiao-s3"
          HEADER_B64=""
          ENV_B64=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VAR_NAME="${{ inputs.variant_name }}"
            BOARD_ID="${{ inputs.board }}"
            HEADER_B64="${{ inputs.variant_header_b64 }}"
            ENV_B64="${{ inputs.platformio_env_b64 }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            VAR_NAME="${{ github.event.client_payload.variant_name || 'custom_online_variant' }}"
            BOARD_ID="${{ github.event.client_payload.board || 'seeed-xiao-s3' }}"
            HEADER_B64="${{ github.event.client_payload.variant_header_b64 }}"
            ENV_B64="${{ github.event.client_payload.platformio_env_b64 }}"
          elif [ "${{ github.event_name }}" = "issues" ]; then
            # Extract from issue body (JSON block between ```json and ```)
            BODY=$(cat << 'EOF'
          ${{ github.event.issue.body }}
          EOF
          )
            JSON_PAYLOAD=$(echo "$BODY" | sed -n '/```json/,/```/p' | sed '1d;$d')
            VAR_NAME=$(echo "$JSON_PAYLOAD" | jq -r '.variant_name // "custom_online_variant"')
            BOARD_ID=$(echo "$JSON_PAYLOAD" | jq -r '.board // "seeed-xiao-s3"')
            HEADER_B64=$(echo "$JSON_PAYLOAD" | jq -r '.variant_header_b64')
            ENV_B64=$(echo "$JSON_PAYLOAD" | jq -r '.platformio_env_b64')
          fi

          echo "variant_name=${VAR_NAME}" >> $GITHUB_OUTPUT
          echo "board_id=${BOARD_ID}" >> $GITHUB_OUTPUT

          # Create the variant directory under variants/esp32s3/diy/
          DEST_DIR="variants/esp32s3/diy/${VAR_NAME}"
          mkdir -p "$DEST_DIR"

          # Decode variant.h
          echo "$HEADER_B64" | base64 -d > "${DEST_DIR}/variant.h"

          # Decode platformio_env.ini
          echo "$ENV_B64" | base64 -d > "${DEST_DIR}/platformio_env.ini"

          # Append environment to root platformio.ini
          echo "" >> platformio.ini
          echo "; --- Generated by Compile On The Go ---" >> platformio.ini
          cat "${DEST_DIR}/platformio_env.ini" >> platformio.ini

          echo "Target variant created at ${DEST_DIR}"
          echo "--- variant.h preview ---"
          head -n 25 "${DEST_DIR}/variant.h"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-custom-${{ steps.prep.outputs.board_id }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-custom-${{ steps.prep.outputs.board_id }}-
            pio-custom-
            pio-${{ runner.os }}-

      - name: Build custom firmware
        run: |
          pio run -e ${{ steps.prep.outputs.variant_name }}

      - name: Build Summary
        run: |
          VAR_NAME="${{ steps.prep.outputs.variant_name }}"
          echo "### 🚀 Compile On The Go Succeeded for \`${VAR_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for f in .pio/build/${VAR_NAME}/*.bin; do
            if [ -f "$f" ]; then
              SIZE=$(ls -lh "$f" | awk '{print $5}')
              NAME=$(basename "$f")
              echo "| \`$NAME\` | $SIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.prep.outputs.variant_name }}
          path: |
            .pio/build/${{ steps.prep.outputs.variant_name }}/firmware-*.bin
            .pio/build/${{ steps.prep.outputs.variant_name }}/firmware-*.factory.bin
            .pio/build/${{ steps.prep.outputs.variant_name }}/littlefs-*.bin
          if-no-files-found: error
          retention-days: 14

      - name: Comment on Issue with Download Link (If triggered by Issue)
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const isSuccess = '${{ job.status }}' === 'success';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const variantName = '${{ steps.prep.outputs.variant_name }}';

            let body = '';
            if (isSuccess) {
              body = `### ✅ Firmware Compilation Succeeded!\n\n` +
                     `Your custom firmware **\`${variantName}\`** has been compiled successfully.\n\n` +
                     `- **Download Artifacts & Factory Bin**: [GitHub Actions Run #${context.runId}](${runUrl})\n\n` +
                     `You can flash the \`.factory.bin\` using [ESP Web Flasher](https://espressif.github.io/esptool-js/) directly in Chrome/Edge!`;
            } else {
              body = `### ❌ Firmware Compilation Failed\n\n` +
                     `The compilation encountered an error. Check the build logs here: [Actions Run #${context.runId}](${runUrl})`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            if (isSuccess) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed'
              });
            }
