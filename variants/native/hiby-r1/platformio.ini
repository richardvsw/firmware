; HiBy R1 Ingenic X1600 Target (SonixOS Base)
[env:hiby-r1]
extends = portduino_base
build_flags =
  ${arduino_base.build_flags}
  -D ARCH_PORTDUINO
  -fPIC
  ; shims dir MUST come first to fix Windows String.h/string.h case collision with libc++ <cstring>
  -Ivariants/native/hiby-r1/include_shims
  -Isrc/platform/portduino
  -Ivariants/native/hiby-r1
  -DRADIOLIB_EEPROM_UNSUPPORTED
  -DMESHTASTIC_EXCLUDE_RTTTL
  -lpthread
  -lyaml-cpp
  -ljsoncpp
  -luv
  -std=gnu17
  -std=gnu++20
  -DMAX_TFT_COLOR_REGIONS=64
  -DUNITY_INCLUDE_DOUBLE
  -DHAS_UDP_MULTICAST=1
  -DPORTDUINO_LINUX_HARDWARE
  -lstdc++fs
  -lbluetooth
  -lgpiod
  -li2c
  -Os
  -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,-s
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D HAS_WIFI=1
  -D USE_FRAMEBUFFER=1
  -D LV_USE_EVDEV=1
  -D LV_COLOR_DEPTH=32
  -D TFT_WIDTH=480
  -D TFT_HEIGHT=800
  -D DISABLE_MUI_PROGRAMMING_MODE=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D USE_PACKET_API
  -D RAM_SIZE=8192
  -D VIEW_240x320
board = buildroot
board_level = extra
build_src_filter = ${portduino_base.build_src_filter} +<platform/extra_variants/hiby_r1>
; Speed up LDF: chain mode only (don't deep-scan all lib headers), no archiving
lib_ldf_mode = chain
lib_archive = no
lib_deps =
  ${portduino_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.28
extra_scripts =
  ${env.extra_scripts}
  pre:variants/esp32s3/diy/RiV_mui_extras/mui_extras.py
  pre:variants/native/hiby-r1/hiby_fbdriver.py
custom_hiby_touch_device = /dev/input/event1
custom_hiby_touch_swap_axes = 0
; raw touch range (the controller reports none): min_x min_y max_x max_y; maps it onto the scaled UI
custom_hiby_touch_calib = 0 0 480 800
; UI size: percent of the 480x800 panel the UI is magnified by (100 = off)
custom_hiby_ui_scale = 110
; power button (KEY_POWER) and backlight used for screen on/off and timeout
custom_hiby_power_device = /dev/input/event0
custom_hiby_backlight = /sys/class/backlight/backlight_pwm0
custom_riv_mui_features = keyboard emoji chat themes advanced wake compose screensaver stickman
custom_riv_mui_emoji = full
custom_riv_mui_notify_pin = 48
custom_riv_mui_kb_height = 40
