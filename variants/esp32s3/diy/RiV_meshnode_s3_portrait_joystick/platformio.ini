[env:RiV_meshnode-s3-portrait-joystick]
extends = env:RiV_meshnode-s3-joystick

extra_scripts =
  ${env:RiV_meshnode-s3-joystick.extra_scripts}
  pre:variants/esp32s3/diy/RiV_meshnode_s3_portrait_joystick/portrait_defines.py

build_flags =
  ${env:RiV_meshnode-s3-joystick.build_flags}
  ; PORTRAIT
  -D VIEW_240x320
  -D LGFX_ROTATION=0
  -D DISPLAY_SIZE=240x320
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
