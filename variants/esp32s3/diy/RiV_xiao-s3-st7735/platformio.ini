; XIAO ESP32S3 + Wio-SX1262 + ST7735S 128x160 (MUI, 2x downscaled UI)

[st7735_common]
extends             = esp32s3_base
board               = seeed-xiao-s3
board_level         = extra
board_build.partitions = partition-table-8MB.csv
upload_protocol     = esptool
upload_speed        = 921600
custom_meshtastic_has_mui = true
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}

extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-st7735/patch_device_ui.py

build_flags         =
    ${esp32s3_base.build_flags} -Os
    -D BOARD_HAS_PSRAM
    -D SEEED_XIAO_S3
    -DVARIANT_XIAO_S3_ST7735
    -I variants/esp32s3/diy/RiV_xiao-s3-st7735
    ; MUI
    -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
    -D MESHTASTIC_EXCLUDE_WEBSERVER=1
    -D MESHTASTIC_EXCLUDE_SERIAL=1
    -D MESHTASTIC_EXCLUDE_SOCKETAPI=1
    -D MESHTASTIC_EXCLUDE_SCREEN=1
    -D MESHTASTIC_EXCLUDE_I2C=1
    -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    ; LCD
    -DUSE_LOVYAN_GFX
    -DLGFX_DRIVER_TEMPLATE
    -DLGFX_DRIVER=LGFX_GENERIC
    -DLGFX_PANEL=ST7735S
    -DLGFX_SCREEN_WIDTH=240
    -DLGFX_SCREEN_HEIGHT=320
    -DLGFX_PANEL_WIDTH=128
    -DLGFX_PANEL_HEIGHT=160
    -DLGFX_DOWNSCALE=2
    -DLGFX_INVERT_COLOR=false
    -DLGFX_READABLE=false
    -DLGFX_CFG_HOST=SPI2_HOST
    -DLGFX_PIN_SCK=7
    -DLGFX_PIN_MOSI=9
    -DLGFX_PIN_MISO=8
    ; FEATURES
    -DHAS_SCREEN=0
    -DHAS_TFT=1
    -D USE_PACKET_API
    -D DISABLE_MUI_PROGRAMMING_MODE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_USE_SYSMON=0
    -D LV_USE_PROFILER=0
    -D LV_USE_PERF_MONITOR=0
    -D LV_USE_MEM_MONITOR=0
    -D LV_USE_LOG=0
    -DVIEW_240x320
    -DDISPLAY_SIZE=240x320
    -DDISPLAY_SET_RESOLUTION
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=9
    -DTFT_SCLK=7
    -DTFT_MISO=8
    -DTFT_BUSY=-1
    -DSPI_READ_FREQUENCY=20000000
    -DMAP_FULL_REDRAW
    ; RAM
    -D RAM_SIZE=5120
    -D STBI_ARENA_SIZE=1500000
    -D LV_CACHE_DEF_SIZE=0
    ; DISABLED
    -DHAS_RTC=0
    -DHAS_BUZZER=0
    -DHAS_WS2812=0
    -DMESHTASTIC_EXCLUDE_AUDIO=1
    -D SCREEN_TRANSITION_FRAMERATE=30
    -D BRIGHTNESS_DEFAULT=130
    -D CONFIG_DISABLE_HAL_LOCKS=1
    -D RADIOLIB_SPI_PARANOID=0
    -D RADIOLIB_DEBUG_BASIC=0
    -D RADIOLIB_DEBUG_SPI=0
    -D RADIOLIB_DEBUG_PROTOCOL=0
    -D LV_BUILD_TEST=0
    -D USE_LOG_DEBUG
    -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
    -Wno-error
    -w

build_unflags = -Werror

build_src_filter    = ${esp32s3_base.build_src_filter}

board_build.variant = RiV_xiao-s3-st7735
board_build.variants_dir = variants/esp32s3/diy

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.21

lib_ignore =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2

; JOYSTICK
[env:RiV_xiao-s3-st7735]
extends = st7735_common
build_flags =
    ${st7735_common.build_flags}
    ; LCD
    -DLGFX_ROTATION=0
    -DLGFX_RGB_ORDER=false
    -DLGFX_PIN_CS=5
    -DLGFX_PIN_DC=6
    -DLGFX_PIN_RST=44
    -DTFT_CS=5
    -DTFT_DC=6
    -DTFT_RST=44
    -DSPI_FREQUENCY=20000000
    ; JOYSTICK
    -DINPUTDRIVER_ENCODER_TYPE=3
    -DINPUTDRIVER_ENCODER_UP=3
    -DINPUTDRIVER_ENCODER_DOWN=4
    -DINPUTDRIVER_ENCODER_LEFT=2
    -DINPUTDRIVER_ENCODER_RIGHT=1
    -DINPUTDRIVER_ENCODER_BTN=43

; GPS
[env:RiV_xiao-s3-st7735-gps]
extends = st7735_common
build_flags =
    ${st7735_common.build_flags}
    -DST7735_GPS_WIRING
    ; LCD
    -DLGFX_ROTATION=2
    -DLGFX_RGB_ORDER=true
    -DLGFX_PIN_CS=2
    -DLGFX_PIN_DC=3
    -DLGFX_PIN_RST=4
    -DTFT_CS=2
    -DTFT_DC=3
    -DTFT_RST=4
    -DSPI_FREQUENCY=10000000
    ; BUTTONS
    -DINPUTDRIVER_ENCODER_TYPE=3
    -DINPUTDRIVER_ENCODER_UP=5
    -DINPUTDRIVER_ENCODER_DOWN=6
    -DINPUTDRIVER_ENCODER_BTN=21
