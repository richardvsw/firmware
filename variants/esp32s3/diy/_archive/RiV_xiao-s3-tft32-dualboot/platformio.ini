; Temporary dual boot variant for the XIAO S3 + Wio-SX1262 + 3.2" ILI9341 (240x320) TFT + XPT2046 wiring:
;   TFT_CS D0, TFT_DC D1, TFT_BL D2, TOUCH_CS D3, battery ADC D4, SD_CS D5, GPS TX D6 / RX D7, shared SPI on D8/D9/D10,
;   LCD reset on EN. A launcher in the factory slot lets you pick Meshtastic (MUI) or Pathfinder at power-up, both apps point the
;   boot partition back to the launcher so any restart returns to the menu.
; Launcher and Pathfinder are separate PlatformIO projects in launcher/ and pathfinder/, build_dualboot.py builds and merges all three.
; The panel is used in landscape (320x240, connector on the left), the same as Pathfinder's native UI size.

[env:RiV_xiao-s3-tft32-dualboot]
extends                 = esp32s3_base
board                   = seeed-xiao-s3
board_level             = extra
board_build.partitions  = variants/esp32s3/diy/RiV_xiao-s3-tft32-dualboot/partitions.csv
board_build.variant     = RiV_xiao-s3-tft32-dualboot
board_build.variants_dir = variants/esp32s3/diy
upload_protocol         = esptool
upload_speed            = 921600
custom_meshtastic_has_mui = true
custom_sdkconfig        =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft32-dualboot/region_list.py

build_flags             =
    ${esp32s3_base.build_flags} -Os
    -D BOARD_HAS_PSRAM
    -D ARCH_ESP32
    -D SEEED_XIAO_S3
    -D VARIANT_XIAO_S3_TFT32_DUALBOOT
    -D XIAO_TFT_DUALBOOT
    -D SD_SPI_FREQUENCY=10000000
    -I variants/esp32s3/diy/RiV_xiao-s3-tft32-dualboot

    ; MUI trim, no I2C on this wiring (D5 and D6 are SD and GPS)
    -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
    -D MESHTASTIC_EXCLUDE_WEBSERVER=1
    -D MESHTASTIC_EXCLUDE_SERIAL=1
    -D MESHTASTIC_EXCLUDE_SOCKETAPI=1
    -D MESHTASTIC_EXCLUDE_SCREEN=1
    -D MESHTASTIC_EXCLUDE_I2C=1
    -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    -D MESHTASTIC_EXCLUDE_AUDIO=1

    ; UI and display engine
    -D HAS_SCREEN=0
    -D HAS_TFT=1
    -D USE_PACKET_API
    -D DISABLE_MUI_PROGRAMMING_MODE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_USE_SYSMON=0
    -D LV_USE_PROFILER=0
    -D LV_USE_PERF_MONITOR=0
    -D LV_USE_MEM_MONITOR=0
    -D LV_USE_LOG=0
    -D HAS_SDCARD

    ; system tuning
    -D RAM_SIZE=5120
    -D STBI_ARENA_SIZE=1500000
    -D LV_CACHE_DEF_SIZE=0
    -D SCREEN_TRANSITION_FRAMERATE=30
    -D BRIGHTNESS_DEFAULT=130
    -D CONFIG_DISABLE_HAL_LOCKS=1
    -D RADIOLIB_SPI_PARANOID=0
    -Wno-error
    -w

    ; display: ILI9341 240x320 panel drawn as a 320x240 landscape canvas (connector on the left)
    -D USE_LOVYAN_GFX
    -D LGFX_DRIVER_TEMPLATE
    -D LGFX_DRIVER=LGFX_GENERIC
    -D LGFX_CFG_HOST=SPI2_HOST
    -D LGFX_PIN_CS=1
    -D LGFX_PIN_DC=2
    -D LGFX_PIN_BL=3
    -D LGFX_PIN_RST=-1
    -D LGFX_PIN_SCK=7
    -D LGFX_PIN_MISO=8
    -D LGFX_PIN_MOSI=9
    -D LGFX_TOUCH=XPT2046
    -D LGFX_TOUCH_CS=4
    -D LGFX_TOUCH_INT=-1
    -D LGFX_TOUCH_CLK=7
    -D LGFX_TOUCH_DO=8
    -D LGFX_TOUCH_DIN=9
    -D LGFX_TOUCH_SPI_HOST=SPI2_HOST
    -D LGFX_TOUCH_SPI_FREQ=2500000
    -D LGFX_TOUCH_X_MIN=300
    -D LGFX_TOUCH_X_MAX=3900
    -D LGFX_TOUCH_Y_MIN=300
    -D LGFX_TOUCH_Y_MAX=3900
    -D LGFX_PANEL=ILI9341
    -D LGFX_INVERT_COLOR=false
    -D LGFX_RGB_ORDER=false
    -D LGFX_READABLE=false
    -D DISPLAY_SET_RESOLUTION
    -D ILI9341_DRIVER
    -D ILI9341_SPI_HOST=SPI2_HOST
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D MAP_FULL_REDRAW
    -D TFT_OFFSET_X=0
    -D TFT_OFFSET_Y=0
    -D TFT_OFFSET_ROTATION=0
    -D LGFX_PANEL_WIDTH=240
    -D LGFX_PANEL_HEIGHT=320
    -D LGFX_SCREEN_WIDTH=320
    -D LGFX_SCREEN_HEIGHT=240
    -D LGFX_ROTATION=3
    -D LGFX_TOUCH_ROTATION=7
    -D VIEW_320x240
    -D DISPLAY_SIZE=320x240

build_src_filter        =
      ${esp32s3_base.build_src_filter}

lib_deps                =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.21
lib_ignore              =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2
