; Pathfinder for the dual boot: runs from the ota_1 slot, built for the RiV_xiao-s3-tft wiring (ILI9488 via LovyanGFX)
[platformio]
default_envs = pathfinder

[env:pathfinder]
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = ../partitions.csv
extra_scripts = pre:lvgl_fatfs.py

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
    -Os

lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    jgromes/RadioLib@^6.6.0
    lvgl/lvgl@^8.3.11
