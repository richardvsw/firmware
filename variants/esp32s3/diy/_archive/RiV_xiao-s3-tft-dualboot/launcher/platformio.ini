; Dual boot launcher: runs from the factory slot, lets the user pick Meshtastic (ota_0) or Pathfinder (ota_1)
[platformio]
default_envs = launcher

[env:launcher]
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = ../partitions.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -Os
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
