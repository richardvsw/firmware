; Dual boot on the XIAO S3 + Wio-SX1262 + ILI9488 TFT: a small launcher in the factory slot lets you pick Meshtastic (MUI) or
; Pathfinder at power-up. Both apps point the boot partition back to the launcher, so any restart returns to the menu.
; Launcher and Pathfinder are separate PlatformIO projects in launcher/ and pathfinder/, build_dualboot.py builds and merges all three.
[env:RiV_xiao-s3-tft-dualboot]
extends = env:RiV_xiao-s3-tft-portrait-en
board_build.partitions = variants/esp32s3/diy/RiV_xiao-s3-tft-dualboot/partitions.csv
extra_scripts =
  ${env:RiV_xiao-s3-tft-portrait-en.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/emoji/emoji_patch.py
build_flags =
  ${env:RiV_xiao-s3-tft-portrait-en.build_flags}
  -DXIAO_TFT_DUALBOOT
  -DSD_SPI_FREQUENCY=10000000
