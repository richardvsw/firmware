[env:RiV_meshnode-s3-4in-joystick]
extends = env:RiV_meshnode-s3-joystick

build_flags =
  ${env:RiV_meshnode-s3-joystick.build_flags}
  -I variants/esp32s3/diy/RiV_meshnode_s3_4in_joystick
  ; LCD
  -D LGFX_PANEL=ILI9488IPS
  -D LGFX_SCREEN_WIDTH=480
  -D LGFX_PANEL_WIDTH=320
  -D LGFX_PANEL_HEIGHT=480
  -D LGFX_ROTATION=1
  -D LGFX_READABLE=false
  -D DISPLAY_SET_RESOLUTION
  -D DISPLAY_SIZE=480x320
  -D TFT_HEIGHT=480
