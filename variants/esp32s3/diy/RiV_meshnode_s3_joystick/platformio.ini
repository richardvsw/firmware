[env:RiV_meshnode-s3-joystick]
extends = env:RiV_meshnode-s3

extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_meshnode_s3_joystick/patch_joystick.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py

build_unflags =
  ${env:RiV_meshnode-s3.build_unflags}
  -D PIR_SENSE_PIN=39
  -D PIR_SENSE_PULLUP=false

build_flags =
  ${env:RiV_meshnode-s3.build_flags}
  ; JOYSTICK (LEFT=7, RIGHT=8, BTN=38 inherited)
  -D INPUTDRIVER_ENCODER_UP=41
  -D INPUTDRIVER_ENCODER_DOWN=42
