[env:RiV_meshnode-s3-joystick]
extends = env:RiV_meshnode-s3

extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_meshnode_s3_joystick/patch_joystick.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
  pre:variants/esp32s3/diy/RiV_mui_extras/mui_extras.py

custom_riv_mui_features = keyboard emoji chat themes advanced wake compose screensaver
custom_riv_mui_emoji = full
custom_riv_mui_notify_pin = 48

lib_ignore =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2

build_unflags =
  ${env:RiV_meshnode-s3.build_unflags}
  -D PIR_SENSE_PIN=39
  -D PIR_SENSE_PULLUP=false
  -D EXCLUDE_SD_CARD=1

build_flags =
  ${env:RiV_meshnode-s3.build_flags}
  ; JOYSTICK (LEFT=7, RIGHT=8, BTN=38 inherited)
  -D INPUTDRIVER_ENCODER_UP=41
  -D INPUTDRIVER_ENCODER_DOWN=42
  ; SD CARD (SPI2, shared with display; CS=GPIO10)
  -D HAS_SDCARD
  -D SDCARD_CS=10
  -D SD_SPI_FREQUENCY=10000000
  -D SPI_SCK=12
  -D SPI_MISO=13
  -D SPI_MOSI=11
