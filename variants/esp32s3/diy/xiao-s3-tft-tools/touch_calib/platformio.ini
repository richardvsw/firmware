; Stand-alone touch/rotation calibration sketch for the xiao-s3-tft variant (XIAO ESP32S3 + Wio-SX1262 + ILI9488 IPS + XPT2046).
; Build from this folder:  pio run -e touch_calib   (separate from the firmware project)
[env:touch_calib]
platform = https://github.com/meshtastic/pioarduino-platform-espressif32/archive/refs/heads/55.03.311.zip
board = esp32s3box
framework = arduino
monitor_speed = 115200

board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -O2

lib_deps =
  lovyan03/LovyanGFX@1.2.21
