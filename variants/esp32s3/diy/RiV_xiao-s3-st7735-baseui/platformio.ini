; XIAO ESP32S3 + Wio-SX1262 + ST7735S 128x160 + GPS (BaseUI with offline map)

[env:RiV_xiao-s3-st7735-baseui]
extends = esp32s3_base
board_level = extra
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-st7735-baseui/embed_basemap.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-st7735-baseui/patch_baseui_map.py

build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/diy/RiV_xiao-s3-st7735-baseui/variant
  -DBOARD_HAS_PSRAM
  ; MAP
  -DBASEUI_HAS_MAP=1
  -DBASEUI_MAP_ZOOM_ON_SELECT=1
  -DBASEUI_MAP_FIXED_LAT=-0.0354869
  -DBASEUI_MAP_FIXED_LON=109.3252595
  -DBASEUI_MAP_START_RANGE_M=7000
  ; LCD
  -DBASEUI_TFT_ROTATION=2
  -DBASEUI_TFT_RGB_ORDER=true
  -DTFT_INVERT=false

build_src_filter = ${esp32s3_base.build_src_filter}

board_build.variant = variant
board_build.variants_dir = variants/esp32s3/diy/RiV_xiao-s3-st7735-baseui

lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=custom.pio depName=LovyanGFX packageName=lovyan03/library/LovyanGFX
  lovyan03/LovyanGFX@1.2.28
