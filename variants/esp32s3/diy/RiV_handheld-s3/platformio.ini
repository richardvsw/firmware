; ─── RiV_handheld-s3 PlatformIO environment ──────────────────────────────────────
; Add this section to your Meshtastic firmware platformio.ini
; or use as standalone reference

[env:RiV_handheld-s3]
extends             = esp32s3_base
board               = esp32s3box          ; ESP32-S3 N16R8 compatible
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_level = extra
custom_meshtastic_has_mui = true

build_flags         =
    ${esp32s3_base.build_flags}
    -D BOARD_HAS_PSRAM
    -DVARIANT_HANDHELD_S3
    -I variants/esp32s3/diy/RiV_handheld-s3
    ; Display
    -DUSE_LOVYAN_GFX
    -DLGFX_DRIVER_TEMPLATE
    -DLGFX_DRIVER=LGFX_GENERIC
    -DLGFX_PANEL=ILI9341
    -DLGFX_SCREEN_WIDTH=240
    -DLGFX_SCREEN_HEIGHT=320
    -DLGFX_ROTATION=3
    -DLGFX_INVERT_COLOR=false
    -DLGFX_PIN_SCK=12
    -DLGFX_PIN_MOSI=11
    -DLGFX_PIN_MISO=13
    -DLGFX_PIN_DC=16
    -DLGFX_PIN_CS=15
    -DLGFX_PIN_RST=3
    -DLGFX_PIN_BL=4
    -DLGFX_TOUCH=XPT2046
    -DLGFX_TOUCH_CS=5
    -DLGFX_TOUCH_INT=-1
    -DLGFX_TOUCH_CLK=12
    -DLGFX_TOUCH_DIN=11
    -DLGFX_TOUCH_DO=13
    -DLGFX_TOUCH_SPI_HOST=SPI2_HOST
    -DLGFX_CFG_HOST=SPI2_HOST
    -DLGFX_TOUCH_X_MIN=3900
    -DLGFX_TOUCH_X_MAX=300
    -DLGFX_TOUCH_Y_MIN=300
    -DLGFX_TOUCH_Y_MAX=3900
    ; LoRa
    -DUSE_RF95
    ; Features
    -DHAS_GPS=1
    -DHAS_CARDKB=1
    -DHAS_BME280=1
    -DHAS_SCREEN=1
    -DHAS_TFT=1
    -DUSE_TFTDISPLAY=1
    -D USE_PACKET_API
    -D MESHNODE_S3_TFT
    -D USERPREFS_FIXED_BLUETOOTH=123456
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_USE_SYSMON=0
    -D LV_USE_PROFILER=0
    -D LV_USE_PERF_MONITOR=0
    -D LV_USE_MEM_MONITOR=0
    -D LV_USE_LOG=0
    -DVIEW_320x240
    -DDISPLAY_SIZE=320x240
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=240
    -DTFT_CS=15
    -DTFT_DC=16
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_RST=3
    -DTFT_BL=4
    -DTFT_BUSY=-1
    -DTOUCH_CS=5
    -DSCREEN_TOUCH_INT=6
    -DHAS_SDCARD
    -DSDCARD_CS=7
    -DILI9341_DRIVER
    -DILI9341_SPI_HOST=SPI2_HOST
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DMAP_FULL_REDRAW
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DTFT_OFFSET_ROTATION=0
    ; RAM tuning for N16R8 (8MB OPI PSRAM) — 6MB LVGL pool (was 5MB, hit 94% usage)
    -D RAM_SIZE=6144
    -D STBI_ARENA_SIZE=1500000
    -D LV_CACHE_DEF_SIZE=0
    ; Disable unused
    -DHAS_RTC=0
    -DHAS_BUZZER=0
    -DHAS_WS2812=0
    -DMESHTASTIC_EXCLUDE_AUDIO=1
    -DMESHTASTIC_EXCLUDE_WEBSERVER=1
    -D SCREEN_TRANSITION_FRAMERATE=30
    -D BRIGHTNESS_DEFAULT=130
    -D CONFIG_DISABLE_HAL_LOCKS=1
    -D RADIOLIB_SPI_PARANOID=1
    -D RADIOLIB_DEBUG_BASIC=0
    -D RADIOLIB_DEBUG_SPI=0
    -D RADIOLIB_DEBUG_PROTOCOL=0
    -D LV_BUILD_TEST=0
    -D USE_LOG_DEBUG
    -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
    -Wno-error=deprecated-enum-enum-conversion
    -Wno-deprecated-enum-enum-conversion
    -Wno-error
    -w

build_unflags = -Werror

build_src_filter    = ${esp32s3_base.build_src_filter}

; Variant folder
board_build.variant = RiV_handheld-s3
board_build.variants_dir = variants/esp32s3/diy

extra_scripts       =
    ${esp32s3_base.extra_scripts}
    pre:variants/esp32s3/diy/RiV_meshnode_s3/patch_encoder.py
    pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.21

lib_ignore =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2

; ─── 3.2" ILI9341 variant — run xpt2046-calib tool to get correct values ───────
[env:RiV_handheld-s3-32in]
extends             = env:RiV_handheld-s3
build_flags         =
    ${env:RiV_handheld-s3.build_flags}
    -DLGFX_ROTATION=3
    -DLGFX_TOUCH_ROTATION=4

; ─── 4.0" ILI9488 IPS variant (480x320 landscape) ──────────────────────────────
; Wiring vs base: same SPI pins. Do NOT wire display SDO/MISO (bus contention).
; Touch T_DO stays on MISO=13 (XPT2046 tri-states safely).
[env:RiV_handheld-s3-4in]
extends             = env:RiV_handheld-s3
build_flags         =
    ${env:RiV_handheld-s3.build_flags}
    ; Panel — ILI9488 IPS, 480x320 landscape canvas
    -DLGFX_PANEL=ILI9488IPS
    -DLGFX_SCREEN_WIDTH=480
    -DLGFX_SCREEN_HEIGHT=320
    -DLGFX_PANEL_WIDTH=320
    -DLGFX_PANEL_HEIGHT=480
    -DLGFX_ROTATION=1
    -DLGFX_INVERT_COLOR=false
    -DLGFX_READABLE=false
    ; Touch ROTATION=6 (mirror X + mirror Y) — rot6 handles axis flip, calib non-inverted
    -DLGFX_TOUCH_ROTATION=6
    -DLGFX_TOUCH_X_MIN=300
    -DLGFX_TOUCH_X_MAX=3900
    -DLGFX_TOUCH_Y_MIN=300
    -DLGFX_TOUCH_Y_MAX=3900
    ; UI canvas — 480x320 via DISPLAY_SET_RESOLUTION, VIEW_320x240 layout scales up
    -DDISPLAY_SET_RESOLUTION
    -DDISPLAY_SIZE=480x320
    -DVIEW_320x240
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480

; ─── Joystick variant — touchscreen replaced by 5-way joystick ──────────────────
; Wiring (all active-LOW, connect to GND when pressed, internal pull-up):
;   UP=GPIO17  DOWN=GPIO18  CENTER=GPIO38  LEFT=GPIO5(spare)  RIGHT=GPIO6(spare)
; GPIO 5/6 freed by removing touch controller.
[env:RiV_handheld-s3-joystick]
extends             = env:RiV_handheld-s3

build_flags         =
    ${env:RiV_handheld-s3.build_flags}
    ; Disable touch controller
    -DLGFX_TOUCH_CS=-1
    -DLGFX_TOUCH_INT=-1
    -UTOUCH_CS
    -USCREEN_TOUCH_INT
    ; Disable CardKB (RP2040 emulator no longer present)
    -UHAS_CARDKB
    -DHAS_CARDKB=0
    ; 5-way joystick input — TYPE=3, UP/DOWN are discrete pins (no quadrature)
    ; UP fires intUpHandler → enc_diff=-1 (scroll up)
    ; DOWN fires intDownHandler → enc_diff=+1 (scroll down)
    ; CENTER is polled → LV_KEY_ENTER (select)
    ; LEFT/RIGHT (GPIO5/6) are spare — not consumed by the driver
    -DINPUTDRIVER_ENCODER_TYPE=3
    -DINPUTDRIVER_ENCODER_UP=17
    -DINPUTDRIVER_ENCODER_DOWN=18
    -DINPUTDRIVER_ENCODER_BTN=38
    -DINPUTDRIVER_BUTTON_TYPE=0

