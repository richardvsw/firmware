; ─── RiV_xiao-s3-tft PlatformIO environment ───────────────────────────────────────
; Seeed XIAO ESP32S3 + Wio-SX1262 baseboard + 3.5" ILI9488/XPT2046 touch TFT (480x320)
; LoRa/board settings copied from variants/esp32s3/seeed_xiao_s3 (official Wio-SX1262 support).
; Display/MUI/LVGL settings adapted from variants/esp32s3/diy/RiV_handheld-s3.
; Add this section to your Meshtastic firmware platformio.ini
; or use as standalone reference

[env:RiV_xiao-s3-tft]
extends             = esp32s3_base
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
board               = seeed-xiao-s3
board_level         = extra
board_build.partitions = partition-table-8MB.csv
upload_protocol     = esptool
upload_speed        = 921600
custom_meshtastic_has_mui = true
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}

build_flags         =
    ${esp32s3_base.build_flags} -Os
    -D BOARD_HAS_PSRAM
    -D SEEED_XIAO_S3
    -DVARIANT_XIAO_S3_TFT
    -I variants/esp32s3/diy/RiV_xiao-s3-tft
    ; MUI-only (as in elecrow_panel): legacy Screen disabled, trim modules to save the XIAO's small internal RAM
    -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
    -D MESHTASTIC_EXCLUDE_WEBSERVER=1
    -D MESHTASTIC_EXCLUDE_SERIAL=1
    -D MESHTASTIC_EXCLUDE_SOCKETAPI=1
    -D MESHTASTIC_EXCLUDE_SCREEN=1
    -D MESHTASTIC_EXCLUDE_I2C=1
    -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    ; Display — MUI uses meshtastic-device-ui's LGFX_GENERIC template (graphics/LGFX/LGFX_GENERIC.h),
    ; NOT src/graphics/TFTDisplay.cpp's inline classes. Entirely macro-configured below.
    -DUSE_LOVYAN_GFX
    -DLGFX_DRIVER_TEMPLATE
    -DLGFX_DRIVER=LGFX_GENERIC
    -DRIV_NO_PANEL_SLEEP=1
    ; IPS module: LovyanGFX's ILI9488IPS profile (IPS gamma/power init). This module needs NO color inversion
    ; (tested: LGFX_INVERT_COLOR=true gave inverted colors).
    -DLGFX_PANEL=ILI9488IPS
    ; UI canvas is landscape 480x320; the panel itself is 320x480 native, rotated by LGFX_ROTATION
    ; (LGFX_PANEL_WIDTH/HEIGHT come from this variant's own graphics/LGFX/LGFX_GENERIC.h)
    -DLGFX_SCREEN_WIDTH=480
    -DLGFX_SCREEN_HEIGHT=320
    -DLGFX_PANEL_WIDTH=320
    -DLGFX_PANEL_HEIGHT=480
    -DLGFX_ROTATION=1
    -DLGFX_INVERT_COLOR=false
    -DLGFX_RGB_ORDER=false
    ; Write-only display: the LCD's SDO/MISO pin is NOT wired (it jams the bus shared with the radio)
    -DLGFX_READABLE=false
    -DLGFX_CFG_HOST=SPI2_HOST
    -DLGFX_PIN_SCK=7
    -DLGFX_PIN_MOSI=9
    -DLGFX_PIN_MISO=8
    -DLGFX_PIN_DC=2
    -DLGFX_PIN_CS=1
    -DLGFX_PIN_RST=3
    -DLGFX_PIN_BL=4
    -DLGFX_TOUCH=XPT2046
    -DLGFX_TOUCH_CS=5
    -DLGFX_TOUCH_INT=-1
    -DLGFX_TOUCH_ROTATION=6
    -DLGFX_TOUCH_CLK=7
    -DLGFX_TOUCH_DIN=9
    -DLGFX_TOUCH_DO=8
    -DLGFX_TOUCH_SPI_HOST=SPI2_HOST
    -DLGFX_TOUCH_SPI_FREQ=2500000
    -DLGFX_TOUCH_X_MIN=300
    -DLGFX_TOUCH_X_MAX=3900
    -DLGFX_TOUCH_Y_MIN=300
    -DLGFX_TOUCH_Y_MAX=3900
    ; LoRa (SX1262 on Wio-SX1262 baseboard, driven via variant.h USE_SX1262)
    ; Features
    -DHAS_SCREEN=0
    -DHAS_TFT=1
    -D USE_PACKET_API
    -D DISABLE_MUI_PROGRAMMING_MODE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_USE_SYSMON=0
    -D LV_USE_PROFILER=0
    -D LV_USE_PERF_MONITOR=0
    -D LV_USE_MEM_MONITOR=0
    -D LV_USE_LOG=0
    -DVIEW_320x240
    ; DISPLAY_SET_RESOLUTION makes the UI canvas LGFX_SCREEN_WIDTH x LGFX_SCREEN_HEIGHT (480x320 here); the 320x240
    ; view lays itself out to the real canvas size. DISPLAY_SIZE is build metadata only.
    -DDISPLAY_SIZE=480x320
    -DDISPLAY_SET_RESOLUTION
    -DHAS_SDCARD
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_CS=1
    -DTFT_DC=2
    -DTFT_MOSI=9
    -DTFT_SCLK=7
    -DTFT_MISO=8
    -DTFT_RST=3
    -DTFT_BL=4
    -DTFT_BUSY=-1
    -DTOUCH_CS=5
    -DSCREEN_TOUCH_INT=-1
    -DILI9488_DRIVER
    -DILI9488_SPI_HOST=SPI2_HOST
    -DSPI_FREQUENCY=60000000
    -DSPI_READ_FREQUENCY=20000000
    -DMAP_FULL_REDRAW
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DTFT_OFFSET_ROTATION=0
    ; RAM tuning (8MB PSRAM)
    -D RAM_SIZE=5120
    -D STBI_ARENA_SIZE=1500000
    -D LV_CACHE_DEF_SIZE=0
    ; Disable unused
    -DHAS_RTC=0
    -DHAS_BUZZER=0
    -DHAS_WS2812=0
    -DMESHTASTIC_EXCLUDE_AUDIO=1
    -D SCREEN_TRANSITION_FRAMERATE=30
    -D BRIGHTNESS_DEFAULT=130
    -D CONFIG_DISABLE_HAL_LOCKS=1
    -D RADIOLIB_SPI_PARANOID=0
    -D RADIOLIB_DEBUG_BASIC=0
    -D RADIOLIB_DEBUG_SPI=0
    -D RADIOLIB_DEBUG_PROTOCOL=0
    -D LV_BUILD_TEST=0
    -D USE_LOG_DEBUG
    -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
    -Wno-error
    -w

build_unflags = -Werror

build_src_filter    = ${esp32s3_base.build_src_filter}

; Variant folder
board_build.variant = RiV_xiao-s3-tft
board_build.variants_dir = variants/esp32s3/diy

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.21

lib_ignore =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2

; ─── Optional sub-variant: portrait 320x480 (ILI9488 IPS + XPT2046) ──────────────
; Same board/wiring as [env:RiV_xiao-s3-tft]; only the display orientation differs (MUI portrait layout).
[env:RiV_xiao-s3-tft-portrait]
extends = env:RiV_xiao-s3-tft
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/keyboard_height.py
build_flags         =
    ${esp32s3_base.build_flags} -Os
    -D BOARD_HAS_PSRAM
    -D SEEED_XIAO_S3
    -DVARIANT_XIAO_S3_TFT
    -I variants/esp32s3/diy/RiV_xiao-s3-tft
    ; MUI-only (as in elecrow_panel): legacy Screen disabled, trim modules to save the XIAO's small internal RAM
    -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
    -D MESHTASTIC_EXCLUDE_WEBSERVER=1
    -D MESHTASTIC_EXCLUDE_SERIAL=1
    -D MESHTASTIC_EXCLUDE_SOCKETAPI=1
    -D MESHTASTIC_EXCLUDE_SCREEN=1
    -D MESHTASTIC_EXCLUDE_I2C=1
    -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    ; Display — MUI uses meshtastic-device-ui's LGFX_GENERIC template (graphics/LGFX/LGFX_GENERIC.h),
    ; NOT src/graphics/TFTDisplay.cpp's inline classes. Entirely macro-configured below.
    -DUSE_LOVYAN_GFX
    -DLGFX_DRIVER_TEMPLATE
    -DLGFX_DRIVER=LGFX_GENERIC
    -DRIV_NO_PANEL_SLEEP=1
    ; IPS module: LovyanGFX's ILI9488IPS profile (IPS gamma/power init). This module needs NO color inversion
    ; (tested: LGFX_INVERT_COLOR=true gave inverted colors).
    -DLGFX_PANEL=ILI9488IPS
    ; Portrait 320x480 (native panel orientation), full-screen, same as mesh-tab "3.5 IPS TFT ILI9488 / XPT2046"
    -DLGFX_SCREEN_WIDTH=320
    -DLGFX_SCREEN_HEIGHT=480
    -DLGFX_ROTATION=0 ; portrait, rotated 180 from the other orientation. NOT 4-7: those set the flip flag (mirrored)
    -DLGFX_INVERT_COLOR=false
    -DLGFX_RGB_ORDER=false
    ; Write-only display: the LCD's SDO/MISO pin is NOT wired (it jams the bus shared with the radio)
    -DLGFX_READABLE=false
    -DLGFX_CFG_HOST=SPI2_HOST
    -DLGFX_PIN_SCK=7
    -DLGFX_PIN_MOSI=9
    -DLGFX_PIN_MISO=8
    -DLGFX_PIN_DC=2
    -DLGFX_PIN_CS=1
    -DLGFX_PIN_RST=3
    -DLGFX_PIN_BL=4
    -DLGFX_TOUCH=XPT2046
    -DLGFX_TOUCH_CS=5
    -DLGFX_TOUCH_INT=-1
    -DLGFX_TOUCH_ROTATION=2 ; 4 gave Y-flip only, 0 gave X+Y flip; trying 2 next to cancel the persistent Y-flip
    -DLGFX_TOUCH_CLK=7
    -DLGFX_TOUCH_DIN=9
    -DLGFX_TOUCH_DO=8
    -DLGFX_TOUCH_SPI_HOST=SPI2_HOST
    -DLGFX_TOUCH_SPI_FREQ=2500000
    -DLGFX_TOUCH_X_MIN=300
    -DLGFX_TOUCH_X_MAX=3900
    -DLGFX_TOUCH_Y_MIN=300
    -DLGFX_TOUCH_Y_MAX=3900
    ; LoRa (SX1262 on Wio-SX1262 baseboard, driven via variant.h USE_SX1262)
    ; Features
    -DHAS_SCREEN=0
    -DHAS_TFT=1
    -D USE_PACKET_API
    -D DISABLE_MUI_PROGRAMMING_MODE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_USE_SYSMON=0
    -D LV_USE_PROFILER=0
    -D LV_USE_PERF_MONITOR=0
    -D LV_USE_MEM_MONITOR=0
    -D LV_USE_LOG=0
    -DVIEW_240x320 ; real portrait layout (icon bar at the bottom); it lays out to the 320x480 canvas
    -DDISPLAY_SIZE=320x480 ; portrait
    -DDISPLAY_SET_RESOLUTION
    -DHAS_SDCARD
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_CS=1
    -DTFT_DC=2
    -DTFT_MOSI=9
    -DTFT_SCLK=7
    -DTFT_MISO=8
    -DTFT_RST=3
    -DTFT_BL=4
    -DTFT_BUSY=-1
    -DTOUCH_CS=5
    -DSCREEN_TOUCH_INT=-1
    -DILI9488_DRIVER
    -DILI9488_SPI_HOST=SPI2_HOST
    -DSPI_FREQUENCY=60000000
    -DSPI_READ_FREQUENCY=20000000
    -DMAP_FULL_REDRAW
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DTFT_OFFSET_ROTATION=0
    ; RAM tuning (8MB PSRAM)
    -D RAM_SIZE=5120
    -D STBI_ARENA_SIZE=1500000
    -D LV_CACHE_DEF_SIZE=0
    ; Disable unused
    -DHAS_RTC=0
    -DHAS_BUZZER=0
    -DHAS_WS2812=0
    -DMESHTASTIC_EXCLUDE_AUDIO=1
    -D SCREEN_TRANSITION_FRAMERATE=30
    -D BRIGHTNESS_DEFAULT=130
    -D CONFIG_DISABLE_HAL_LOCKS=1
    -D RADIOLIB_SPI_PARANOID=0
    -D RADIOLIB_DEBUG_BASIC=0
    -D RADIOLIB_DEBUG_SPI=0
    -D RADIOLIB_DEBUG_PROTOCOL=0
    -D LV_BUILD_TEST=0
    -D USE_LOG_DEBUG
    -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
    -Wno-error
    -w

; I2C instead of GPS: SCL D5, SDA D6, SD card stays on D7
[env:RiV_xiao-s3-tft-i2c]
extends = env:RiV_xiao-s3-tft
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/i2c_flags.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
build_flags =
  ${env:RiV_xiao-s3-tft.build_flags}
  -DXIAO_TFT_I2C
  -DMESHTASTIC_EXCLUDE_GPS=1

; portrait v2 (rotation 2, touch 4) with I2C instead of GPS, SD card on D7
[env:RiV_xiao-s3-tft-portrait-i2c]
extends = env:RiV_xiao-s3-tft-portrait
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/portrait_v2_i2c_flags.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/keyboard_height.py
build_flags =
  ${env:RiV_xiao-s3-tft-portrait.build_flags}
  -DLGFX_ROTATION=2
  -DLGFX_TOUCH_ROTATION=4
  -DXIAO_TFT_I2C
  -DMESHTASTIC_EXCLUDE_GPS=1

; portrait rotated 180, LCD RST on EN, I2C on D5/D6, receive-only GPS on D2, SD card on D7
[env:RiV_xiao-s3-tft-portrait-en]
extends = env:RiV_xiao-s3-tft-portrait
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/en_flags.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/keyboard_height.py
build_flags =
  ${env:RiV_xiao-s3-tft-portrait.build_flags}
  -DXIAO_TFT_I2C
  -DXIAO_TFT_EN_RST
  -DLGFX_PIN_RST=-1
  -DTFT_RST=-1
  -DIGNORE_CALIBRATION_DATA

; portrait-en with the shared MUI extras: colour emoji, chat extras, themes, advanced settings, screensaver, meshBot chat background
[env:RiV_xiao-s3-tft-portrait-en-emoji]
extends = env:RiV_xiao-s3-tft-portrait-en
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/en_flags.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
  pre:variants/esp32s3/diy/RiV_mui_extras/mui_extras.py
custom_riv_mui_features = keyboard emoji chat themes advanced wake compose screensaver stickman meshbot rotate
custom_riv_mui_emoji = full
custom_riv_mui_kb_height = 34
build_flags =
  ${env:RiV_xiao-s3-tft-portrait-en.build_flags}
  -DRIV_ROTATE=1
  -DRIV_LAND_ROTATION=1
  -DRIV_LAND_TOUCH_ROTATION=6
  -DSD_SPI_FREQUENCY=10000000

; same as portrait-en-emoji without the meshBot chat background, the build tested as v7 to v15
[env:RiV_xiao-s3-tft-portrait-en-extras]
extends = env:RiV_xiao-s3-tft-portrait-en-emoji
custom_riv_mui_features = keyboard emoji chat themes advanced wake compose screensaver stickman

; Alias for RiV_xiao-s3-tft-en-emoji
[env:RiV_xiao-s3-tft-en-emoji]
extends = env:RiV_xiao-s3-tft-portrait-en-emoji
