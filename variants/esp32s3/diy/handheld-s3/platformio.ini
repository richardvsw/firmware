; ─── handheld-s3 PlatformIO environment ──────────────────────────────────────
; Add this section to your Meshtastic firmware platformio.ini
; or use as standalone reference

[env:handheld-s3]
extends             = esp32s3_base
board               = esp32s3box          ; ESP32-S3 N16R8 compatible
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags         =
    ${esp32s3_base.build_flags}
    -DVARIANT_HANDHELD_S3
    -DARDUINO_ARCH_ESP32
    -DCONFIG_IDF_TARGET_ESP32S3
    ; Display
    -DUSE_LOVYAN_GFX
    -DLGFX_DRIVER_TEMPLATE
    ; LoRa
    -DUSE_RF95
    ; Features
    -DHAS_GPS=1
    -DHAS_CARDKB=1
    -DHAS_BME280=1
    -DHAS_SCREEN=1
    ; Disable unused
    -DHAS_RTC=0
    -DHAS_BUZZER=0
    -DHAS_WS2812=0

build_src_filter    = ${esp32s3_base.build_src_filter}

; Variant folder
board_build.variant = handheld-s3
board_build.variants_dir = variants/esp32s3/diy
