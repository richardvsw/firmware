[env:RiV_meshnode-s3]
board_level = extra
extends = esp32s3_base
board = RiV_meshnode-s3
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
upload_protocol = esptool
upload_speed = 921600

extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_meshnode_s3/patch_encoder.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py

build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -I variants/esp32s3/diy/RiV_meshnode_s3
  ; ── Heap savings: exclude unused subsystems
  -D MESHTASTIC_EXCLUDE_WEBSERVER

  ; ── LoRa (RFM95W / SX1276)
  -D USE_RF95
  -Wno-error=deprecated-enum-enum-conversion
  -Wno-deprecated-enum-enum-conversion

  ; ── MUI/TFT enable
  -D HAS_SCREEN=1
  -D HAS_TFT=1
  -D USE_TFTDISPLAY=1
  -D USE_PACKET_API
  -D DISABLE_MUI_PROGRAMMING_MODE=1
  -D SCREEN_ROTATE
  -D MESHNODE_S3_TFT

  ; ── LGFX_GENERIC driver (no custom header needed)
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D LGFX_PANEL=ILI9341
  -D LGFX_INVERT_COLOR=false
  -D LGFX_CFG_HOST=SPI2_HOST
  -D LGFX_SPI_3WIRE=false

  ; ── SPI pins
  -D LGFX_PIN_SCK=12
  -D LGFX_PIN_MOSI=11
  -D LGFX_PIN_MISO=13
  -D LGFX_PIN_DC=16
  -D LGFX_PIN_CS=15
  -D LGFX_PIN_RST=3
  -D LGFX_PIN_BL=4

  ; ── Screen dimensions (portrait)
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_SCREEN_HEIGHT=320
  -D LGFX_ROTATION=3

  ; ── No touch
  -D LGFX_TOUCH_CS=-1
  -D LGFX_TOUCH_INT=-1

  ; ── Backlight PWM
  -D LGFX_PWM_FREQ=44000
  -D LGFX_PWM_CHANNEL=7
  -D LGFX_INVERT_LIGHT=false

  ; ── Display / view config
  -D VIEW_320x240
  -D DISPLAY_SIZE=320x240
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=240
  -D TFT_CS=15
  -D TFT_DC=16
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_MISO=13
  -D TFT_RST=3
  -D TFT_BL=4
  -D TFT_BUSY=-1
  -D ILI9341_DRIVER
  -D ILI9341_SPI_HOST=SPI2_HOST
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D TFT_OFFSET_X=0
  -D TFT_OFFSET_Y=0
  -D TFT_OFFSET_ROTATION=3
  -D SCREEN_TRANSITION_FRAMERATE=30
  -D BRIGHTNESS_DEFAULT=130

  ; ── LVGL config
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0

  ; ── RAM tuning for N16R8 (8MB OPI PSRAM)
  -D RAM_SIZE=5120
  -D STBI_ARENA_SIZE=1500000
  -D LV_CACHE_DEF_SIZE=0

  ; ── Rotary encoder as MUI input
  -D INPUTDRIVER_ENCODER_TYPE=3
  -D INPUTDRIVER_ENCODER_LEFT=7
  -D INPUTDRIVER_ENCODER_RIGHT=8
  -D INPUTDRIVER_ENCODER_BTN=38
  -D INPUTDRIVER_BUTTON_TYPE=0

  ; ── Debug / RadioLib quiet
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D RADIOLIB_DEBUG_BASIC=0
  -D RADIOLIB_DEBUG_SPI=0
  -D RADIOLIB_DEBUG_PROTOCOL=0
  -D RADIOLIB_SPI_PARANOID=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"

  ; ── I2C bus
  -D I2C_SDA=18
  -D I2C_SCL=17

  ; ── BME280
  -D HAS_BME280=1

  ; ── PCF8563 RTC
  -D HAS_PCF8563=1

  ; ── WS2812 x8
  -D HAS_NEOPIXEL
  -D NEOPIXEL_COUNT=8
  -D NEOPIXEL_DATA=5
  -D NEOPIXEL_TYPE=(NEO_GRB+NEO_KHZ800)

  ; ── Passive buzzer
  -D PIN_BUZZER=6
  -D USE_PIN_BUZZER=PIN_BUZZER

  ; ── PIR screen wake
  -D PIR_SENSE_PIN=39
  -D PIR_SENSE_PULLUP=false
  
  -D EXCLUDE_SD_CARD=1
  -D EXCLUDE_MAP=1

  ; ── Battery ADC
  -D BATTERY_PIN=1
  
  -Wno-error
  -w
  ; PNGdec s3_rgb565 SIMD path requires dsps_fft2r_platform.h which is not in
  ; the assembler include path in this build, leaving the symbol undefined.
  ; Disable the SIMD call; PNGdec falls back to its generic C implementation.
  -UARDUINO_ESP32S3_DEV
  
build_unflags =
  -Werror

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<variants/esp32s3/diy/RiV_meshnode_s3/variant.cpp>

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.21
  lewisxhe/SensorLib@0.4.1
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ; TCP socket tuning — prevents socket table exhaustion after prolonged runtime.
  ; After hours of MQTT disconnect/reconnect cycles, TIME_WAIT sockets pile up.
  ; Reducing MSL from 60s→6s cuts TIME_WAIT window from 120s to 12s.
  ; Increasing max active TCP from default gives headroom for MQTT + API + WebServer.
  CONFIG_LWIP_MAX_ACTIVE_TCP=16
  CONFIG_LWIP_TCP_MSL=6000
  ; TCP keepalive — detects zombie connections (phone disappeared without FIN/RST).
  ; Without keepalive, client.connected() returns true indefinitely on CLOSE_WAIT
  ; sockets, blocking new app connections for up to 15 minutes.
  CONFIG_LWIP_SO_KEEPALIVE=y
  CONFIG_LWIP_TCP_KEEPALIVE_IDLE=30
  CONFIG_LWIP_TCP_KEEPALIVE_INTERVAL=5
  CONFIG_LWIP_TCP_KEEPALIVE_COUNT=3

lib_ignore =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2
  SdFat
