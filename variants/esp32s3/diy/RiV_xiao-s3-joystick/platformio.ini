; Same as the official [env:seeed-xiao-s3], plain firmware, no display — just GPS dropped and a
; 5-way discrete joystick (HAS_TRACKBALL) added on the freed pins. Not an upstream/official variant.
[env:RiV_xiao-s3-joystick]
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = XIAO ESP32-S3 + joystick (DIY)
custom_meshtastic_tags = Seeed

extends = esp32s3_base
board_level = extra
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/diy/RiV_xiao-s3-joystick
  -DBOARD_HAS_PSRAM

build_src_filter = ${esp32s3_base.build_src_filter}

board_build.variant = RiV_xiao-s3-joystick
board_build.variants_dir = variants/esp32s3/diy
