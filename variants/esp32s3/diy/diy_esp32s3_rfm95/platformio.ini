[env:diy-esp32s3-rfm95]
board_level = extra
extends = esp32s3_base
board = diy-esp32s3-rfm95
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_opi
upload_protocol = esptool
upload_speed = 921600
build_flags =
  ${esp32s3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32s3/diy/diy_esp32s3_rfm95
  -DBOARD_HAS_PSRAM
