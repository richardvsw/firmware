; Base for Mesh-Tab device (esp32-s3 N16R8 + RFM95 lora)
; Updated for ST7796 3.5" Capacitive Touch (Dedicated SPI3 Bus)
[riv_mesh_tab_base]
extends = esp32s3_base
board = esp32s3box
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
custom_meshtastic_has_mui = true
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}
board_level = extra
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
upload_protocol = esptool
build_flags = ${esp32s3_base.build_flags}
  -D MESH_TAB
  -D BOARD_HAS_PSRAM
  ; SD CARD (LoRa SPI bus, own CS on GPIO42)
  -D HAS_SDCARD
  -D SDCARD_CS=42
  -D SPI_SCK=5
  -D SPI_MISO=3
  -D SPI_MOSI=6
  -D SD_SPI_FREQUENCY=10000000
  -D CONFIG_ARDUHAL_ESP_LOG
  -D CONFIG_ARDUHAL_LOG_COLORS=1
  -D CONFIG_DISABLE_HAL_LOCKS=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_WEBSERVER=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_COMP_CONF_INCLUDE_SIMPLE
  -D LV_USE_SYSMON=0
  -D LV_USE_PROFILER=0
  -D LV_USE_PERF_MONITOR=0
  -D LV_USE_MEM_MONITOR=0
  -D LV_USE_LOG=0
  -D LV_BUILD_TEST=0
  -D USE_LOG_DEBUG
  -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
  -D RADIOLIB_SPI_PARANOID=0
  -D HAS_SCREEN=0
  -D HAS_TFT=1
  -D USE_PIN_BUZZER
  -D MAP_TILES_GREY ; required for 2MB PSRAM
  -D RAM_SIZE=1432
  -D STBI_ARENA_SIZE=450000
  -D LV_CACHE_DEF_SIZE=0
  -D LGFX_DRIVER_TEMPLATE
  -D LGFX_DRIVER=LGFX_GENERIC
  -D GFX_DRIVER_INC=\"graphics/LGFX/LGFX_GENERIC.h\"
  ; ==================== DISPLAY TFT (Dedicated SPI3 Bus) ====================
  -D LGFX_SPI_HOST=SPI3_HOST
  -D LGFX_PIN_SCK=14
  -D LGFX_PIN_MOSI=13
  -D LGFX_PIN_MISO=10
  -D LGFX_PIN_CS=11
  -D LGFX_PIN_DC=15      ; Connected to LCD_RS / DC
  -D LGFX_PIN_RST=16
  -D LGFX_PIN_BL=2
  -D VIEW_240x320
  -D USE_PACKET_API
  -I variants/esp32s3/diy/RiV_mesh-tab-st7796
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
  pre:variants/esp32s3/diy/RiV_mui_extras/mui_extras.py
custom_riv_mui_features = keyboard emoji chat themes advanced wake compose screensaver
custom_riv_mui_emoji = full
custom_riv_mui_notify_pin = 12
build_src_filter = ${esp32s3_base.build_src_filter}
lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.28

; Base Configuration for Capacitive Touch (FT6x36 / FT5x06)
[riv_mesh_tab_ft6x36]
extends = riv_mesh_tab_base
build_flags = ${riv_mesh_tab_base.build_flags}
  -D LGFX_TOUCH=FT5x06   ; LovyanGFX uses FT5x06 driver for FT6336/FT6236
  -D LGFX_TOUCH_I2C_FREQ=400000
  -D LGFX_TOUCH_I2C_PORT=0
  -D LGFX_TOUCH_I2C_ADDR=0x38
  -D LGFX_TOUCH_I2C_SDA=18
  -D LGFX_TOUCH_I2C_SCL=17
  -D LGFX_TOUCH_INT=21
  -D LGFX_TOUCH_RST=1

; Custom Target: 3.5" IPS TFT ST7796 / Capacitive FT6336
[env:RiV_mesh-tab-st7796]
extends = riv_mesh_tab_base
build_flags = ${riv_mesh_tab_ft6x36.build_flags}
  -D SPI_FREQUENCY=40000000 ; Recommended speed for ST7796 SPI
  -D DISPLAY_SET_RESOLUTION
  -D LGFX_SCREEN_WIDTH=320
  -D LGFX_SCREEN_HEIGHT=480
  -D DISPLAY_SIZE=320x480 ; portrait mode
  -D LGFX_PANEL=ST7796
  -D LGFX_ROTATION=2
  -D LGFX_TOUCH_X_MIN=0
  -D LGFX_TOUCH_X_MAX=319
  -D LGFX_TOUCH_Y_MIN=0
  -D LGFX_TOUCH_Y_MAX=479
  -D LGFX_TOUCH_ROTATION=2
