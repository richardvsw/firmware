; ESP32-S3 N16R8 devkit + RFM95W + ST7789 240x240 + 5-way joystick (MUI)

[env:RiV_handheld-s3-st7789]
extends             = esp32s3_base
board               = esp32s3box
board_level         = extra
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
custom_meshtastic_has_mui = true
custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  ${device-ui_base.custom_sdkconfig}

extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:variants/esp32s3/diy/RiV_meshnode_s3_joystick/patch_joystick.py
  pre:variants/esp32s3/diy/RiV_handheld-s3-st7789/patch_device_ui.py
  pre:variants/esp32s3/diy/RiV_xiao-s3-tft/region_list.py
  pre:variants/esp32s3/diy/RiV_mui_extras/mui_extras.py

custom_riv_mui_features = keyboard emoji chat themes advanced wake compose screensaver stickman
custom_riv_mui_emoji = full
custom_riv_mui_notify_pin = -1

build_flags         =
    ${esp32s3_base.build_flags} -Os
    -D BOARD_HAS_PSRAM
    -DVARIANT_HANDHELD_S3_ST7789
    -I variants/esp32s3/diy/RiV_handheld-s3-st7789
    ; MUI
    -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -D MESHTASTIC_EXCLUDE_INPUTBROKER=1
    -D MESHTASTIC_EXCLUDE_WEBSERVER=1
    -D MESHTASTIC_EXCLUDE_SERIAL=1
    -D MESHTASTIC_EXCLUDE_SOCKETAPI=1
    -D MESHTASTIC_EXCLUDE_SCREEN=1
    -D MESHTASTIC_EXCLUDE_I2C=1
    -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
    ; LCD
    -DUSE_LOVYAN_GFX
    -DLGFX_DRIVER_TEMPLATE
    -DLGFX_DRIVER=LGFX_GENERIC
    -DLGFX_PANEL=ST7789
    -DLGFX_SCREEN_WIDTH=240
    -DLGFX_SCREEN_HEIGHT=240
    -DLGFX_ROTATION=0
    -DLGFX_INVERT_COLOR=true
    -DLGFX_RGB_ORDER=false
    -DLGFX_READABLE=false
    -DLGFX_SPI_MODE=3
    -DLGFX_CFG_HOST=SPI3_HOST
    -DLGFX_PIN_SCK=15
    -DLGFX_PIN_MOSI=7
    -DLGFX_PIN_MISO=-1
    -DLGFX_PIN_DC=16
    -DLGFX_PIN_CS=-1
    -DLGFX_PIN_RST=3
    -DLGFX_PIN_BL=4
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=20000000
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=7
    -DTFT_SCLK=15
    -DTFT_MISO=-1
    -DTFT_DC=16
    -DTFT_RST=3
    -DTFT_BL=4
    -DTFT_BUSY=-1
    ; LORA
    -DUSE_RF95
    -DRADIOLIB_SPI_PARANOID=1
    ; SD CARD (LoRa SPI bus, own CS on GPIO39)
    -DHAS_SDCARD
    -DSDCARD_CS=39
    -DSD_SPI_FREQUENCY=10000000
    -DSPI_SCK=12
    -DSPI_MISO=13
    -DSPI_MOSI=11
    ; JOYSTICK
    -DINPUTDRIVER_ENCODER_TYPE=3
    -DINPUTDRIVER_ENCODER_UP=17
    -DINPUTDRIVER_ENCODER_DOWN=18
    -DINPUTDRIVER_ENCODER_LEFT=5
    -DINPUTDRIVER_ENCODER_RIGHT=6
    -DINPUTDRIVER_ENCODER_BTN=38
    -DINPUTDRIVER_BUTTON_TYPE=0
    ; FEATURES
    -DHAS_SCREEN=0
    -DHAS_TFT=1
    -D USE_PACKET_API
    -D DISABLE_MUI_PROGRAMMING_MODE=1
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE
    -D LV_USE_SYSMON=0
    -D LV_USE_PROFILER=0
    -D LV_USE_PERF_MONITOR=0
    -D LV_USE_MEM_MONITOR=0
    -D LV_USE_LOG=0
    -DVIEW_240x320
    -DDISPLAY_SIZE=240x240
    -DDISPLAY_SET_RESOLUTION
    -DMAP_FULL_REDRAW
    ; RAM
    -D RAM_SIZE=6144
    -D STBI_ARENA_SIZE=1500000
    -D LV_CACHE_DEF_SIZE=0
    ; DISABLED
    -DHAS_RTC=0
    -DHAS_BUZZER=0
    -DHAS_WS2812=0
    -DMESHTASTIC_EXCLUDE_AUDIO=1
    -D SCREEN_TRANSITION_FRAMERATE=30
    -D BRIGHTNESS_DEFAULT=130
    -D CONFIG_DISABLE_HAL_LOCKS=1
    -D RADIOLIB_DEBUG_BASIC=0
    -D RADIOLIB_DEBUG_SPI=0
    -D RADIOLIB_DEBUG_PROTOCOL=0
    -D LV_BUILD_TEST=0
    -D USE_LOG_DEBUG
    -D LOG_DEBUG_INC=\"DebugConfiguration.h\"
    -Wno-error
    -w

build_unflags = -Werror

build_src_filter    = ${esp32s3_base.build_src_filter}

board_build.variant = RiV_handheld-s3-st7789
board_build.variants_dir = variants/esp32s3/diy

lib_deps =
  ${esp32s3_base.lib_deps}
  ${device-ui_base.lib_deps}
  lovyan03/LovyanGFX@1.2.21

lib_ignore =
  ${esp32s3_base.lib_ignore}
  ESP32 Codec2
