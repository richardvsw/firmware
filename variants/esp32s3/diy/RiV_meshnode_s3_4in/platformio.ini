[env:RiV_meshnode-s3-4in]
extends = env:RiV_meshnode-s3

build_unflags =
  ${env:RiV_meshnode-s3.build_unflags}
  -D LGFX_PANEL=ILI9341
  -D LGFX_SCREEN_WIDTH=240
  -D LGFX_ROTATION=3
  -D DISPLAY_SIZE=320x240
  -D TFT_HEIGHT=240

build_flags =
  ${env:RiV_meshnode-s3.build_flags}
  -I variants/esp32s3/diy/RiV_meshnode_s3_4in
  ; LCD
  -D LGFX_PANEL=ILI9488IPS
  -D LGFX_SCREEN_WIDTH=480
  -D LGFX_PANEL_WIDTH=320
  -D LGFX_PANEL_HEIGHT=480
  -D LGFX_ROTATION=1
  -D LGFX_READABLE=false
  -D DISPLAY_SET_RESOLUTION
  -D DISPLAY_SIZE=480x320
  -D TFT_HEIGHT=480
